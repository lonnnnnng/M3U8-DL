<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>m3u8dl-go</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="/wails/runtime.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="window-brand">
          <h1>m3u8dl-go</h1>
          <span id="running-count">0 个运行中</span>
        </div>

        <nav class="segmented-nav" aria-label="主导航">
          <button class="nav-item active" type="button" data-view="dashboard">任务</button>
          <button class="nav-item" type="button" data-view="create">新建</button>
          <button class="nav-item" type="button" data-view="settings">设置</button>
          <button class="nav-item" type="button" data-view="output">文件与日志</button>
        </nav>

        <div class="toolbar-actions">
          <button id="refresh-tasks" type="button">刷新</button>
          <button id="start-pending" type="button">开始等待</button>
          <button id="stop-running" type="button">停止运行</button>
          <button id="retry-failed" type="button">重试失败</button>
          <button id="clear-finished" type="button">清理完成</button>
        </div>
      </header>

      <section class="status-strip">
        <div>
          <span>任务总数</span>
          <strong id="task-count">0</strong>
        </div>
        <div>
          <span>当前速度</span>
          <strong id="active-speed">0 B/s</strong>
        </div>
        <div>
          <span id="view-kicker">任务监控</span>
          <strong id="view-title">下载任务</strong>
        </div>
      </section>

      <section class="workspace">
        <section id="view-dashboard" class="view active">
          <div class="dashboard-grid">
            <section class="panel task-panel">
              <div class="panel-title task-list-head">
                <span>任务队列</span>
                <div class="task-tools">
                  <input id="task-search" type="search" placeholder="搜索任务" aria-label="搜索任务" />
                  <select id="task-status-filter" aria-label="筛选任务状态">
                    <option value="all">全部</option>
                    <option value="running">下载中</option>
                    <option value="pending">等待</option>
                    <option value="completed">完成</option>
                    <option value="failed">失败</option>
                    <option value="stopped">已停止</option>
                  </select>
                  <select id="task-sort" aria-label="任务排序">
                    <option value="newest">最新</option>
                    <option value="oldest">最旧</option>
                    <option value="status">状态</option>
                    <option value="progress">进度</option>
                    <option value="title">名称</option>
                  </select>
                  <button class="small-link" type="button" data-view-shortcut="create">新增</button>
                </div>
              </div>
              <div id="task-list" class="task-list"></div>
            </section>

            <section class="panel detail-panel">
              <div class="panel-title">
                <span id="detail-title">任务详情</span>
                <div class="detail-actions">
                  <button id="copy-command" type="button">复制命令</button>
                  <button id="copy-url" type="button">复制地址</button>
                  <button id="copy-log" type="button">复制日志</button>
                  <button id="clone-selected" type="button">复制为新任务</button>
                  <button id="start-selected" type="button">开始</button>
                  <button id="stop-selected" type="button">停止</button>
                  <button id="retry-selected" type="button">重试</button>
                  <button id="remove-selected" type="button">移除</button>
                </div>
              </div>
              <div id="task-summary" class="summary empty">请选择一个任务。</div>
            </section>
          </div>
        </section>

        <section id="view-create" class="view">
          <section class="panel create-panel">
            <div class="panel-title">
              <span>新建下载任务</span>
              <div class="actions">
                <button id="preflight-task" type="button">预检查</button>
                <button id="copy-form-command" type="button">复制命令</button>
                <button id="save-form-settings" type="button">保存默认</button>
                <button id="reset-form" type="button">重置表单</button>
                <button id="create-only" type="button">仅创建</button>
                <button id="create-start" form="task-form" type="submit">创建并下载</button>
              </div>
            </div>

            <form id="task-form" class="form-grid">
              <details class="form-section field-wide" open>
                <summary>基础与输出</summary>
                <div class="section-grid">
                  <label class="field field-wide">
                    <span>m3u8 地址</span>
                    <textarea id="url" rows="7" placeholder="https://example.com/index.m3u8" required></textarea>
                  </label>

                  <label class="field field-wide">
                    <span>BaseURL</span>
                    <input id="baseURL" type="url" placeholder="https://cdn.example.com/path/" />
                  </label>

                  <label class="field field-wide">
                    <span>输出目录</span>
                    <div class="inline-input">
                      <input id="saveDir" type="text" />
                      <button id="choose-dir" type="button">选择</button>
                    </div>
                  </label>

                  <label class="field field-wide">
                    <span>临时目录</span>
                    <div class="inline-input">
                      <input id="tmpDir" type="text" />
                      <button id="choose-tmp-dir" type="button">选择</button>
                    </div>
                  </label>

                  <label class="field">
                    <span>保存名称</span>
                    <input id="saveName" type="text" placeholder="可选" />
                  </label>

                  <label class="field">
                    <span>保存模板</span>
                    <input id="savePattern" type="text" placeholder="Name_Date" />
                  </label>

                  <label class="field">
                    <span>名称分隔符</span>
                    <input id="linkNameSeparator" type="text" value="|" placeholder="|" />
                  </label>

                  <label class="field">
                    <span>下载范围</span>
                    <input id="customRange" type="text" placeholder="0-20" />
                  </label>

                  <label class="field">
                    <span>限速</span>
                    <input id="maxSpeed" type="text" placeholder="2M / 500K" />
                  </label>

                  <label class="field">
                    <span>HTTP 超时（秒）</span>
                    <input id="httpRequestTimeout" type="number" min="0.1" step="0.1" placeholder="100" />
                  </label>

                  <label class="field field-wide">
                    <span>请求头</span>
                    <textarea id="headers" rows="5" placeholder="Cookie: xxx&#10;Referer: https://example.com"></textarea>
                  </label>
                </div>
              </details>

              <details class="form-section field-wide" open>
                <summary>轨道与字幕</summary>
                <div class="section-grid">
                  <label class="field">
                    <span>选择视频</span>
                    <input id="selectVideo" type="text" placeholder="res=1080p:for=best" />
                  </label>

                  <label class="field">
                    <span>丢弃视频</span>
                    <input id="dropVideo" type="text" placeholder="role=trickplay" />
                  </label>

                  <label class="field">
                    <span>选择音频</span>
                    <input id="selectAudio" type="text" placeholder="lang=ja|en:for=best" />
                  </label>

                  <label class="field">
                    <span>丢弃音频</span>
                    <input id="dropAudio" type="text" placeholder="lang=commentary" />
                  </label>

                  <label class="field">
                    <span>选择字幕</span>
                    <input id="selectSubtitle" type="text" placeholder="lang=zh|en:for=all" />
                  </label>

                  <label class="field">
                    <span>丢弃字幕</span>
                    <input id="dropSubtitle" type="text" placeholder="name=forced" />
                  </label>

                  <label class="field">
                    <span>字幕格式</span>
                    <select id="subFormat">
                      <option value="SRT">SRT</option>
                      <option value="VTT">VTT</option>
                    </select>
                  </label>

                  <div class="switches field-wide">
                    <label><input id="autoSelect" type="checkbox" /> 自动选轨</label>
                    <label><input id="subOnly" type="checkbox" /> 只下载字幕</label>
                    <label><input id="autoSubtitleFix" type="checkbox" /> 自动修复字幕</label>
                    <label><input id="concurrentDownload" type="checkbox" /> 多轨并发</label>
                  </div>
                </div>
              </details>

              <details class="form-section field-wide">
                <summary>解密与密钥</summary>
                <div class="section-grid">
                  <label class="field field-wide">
                    <span>解密 Key</span>
                    <textarea id="keys" rows="3" placeholder="每行一个 KEY 或 KID:KEY"></textarea>
                  </label>

                  <label class="field">
                    <span>Key 文本文件</span>
                    <div class="inline-input">
                      <input id="keyTextFile" type="text" placeholder="/path/to/keys.txt" />
                      <button id="choose-key-file" type="button">选择</button>
                    </div>
                  </label>

                  <label class="field">
                    <span>解密引擎</span>
                    <select id="decryptionEngine">
                      <option value="MP4DECRYPT">MP4DECRYPT</option>
                      <option value="SHAKA_PACKAGER">SHAKA_PACKAGER</option>
                      <option value="FFMPEG">FFMPEG</option>
                    </select>
                  </label>

                  <label class="field">
                    <span>解密工具路径</span>
                    <div class="inline-input">
                      <input id="decryptionBinaryPath" type="text" placeholder="/opt/homebrew/bin/mp4decrypt" />
                      <button id="choose-decryption-binary" type="button">选择</button>
                    </div>
                  </label>

                  <label class="field">
                    <span>自定义 HLS Method</span>
                    <select id="customHLSMethod">
                      <option value="">自动</option>
                      <option value="AES_128">AES_128</option>
                      <option value="AES_128_ECB">AES_128_ECB</option>
                      <option value="CENC">CENC</option>
                      <option value="CHACHA20">CHACHA20</option>
                      <option value="NONE">NONE</option>
                      <option value="SAMPLE_AES">SAMPLE_AES</option>
                      <option value="SAMPLE_AES_CTR">SAMPLE_AES_CTR</option>
                      <option value="UNKNOWN">UNKNOWN</option>
                    </select>
                  </label>

                  <label class="field">
                    <span>自定义 HLS Key</span>
                    <input id="customHLSKey" type="password" placeholder="file / hex / base64" autocomplete="off" />
                  </label>

                  <label class="field">
                    <span>自定义 HLS IV</span>
                    <input id="customHLSIV" type="password" placeholder="file / hex / base64" autocomplete="off" />
                  </label>

                  <div class="switches field-wide">
                    <label><input id="mp4RealTimeDecryption" type="checkbox" /> MP4 实时解密</label>
                  </div>
                </div>
              </details>

              <details class="form-section field-wide">
                <summary>直播与过滤</summary>
                <div class="section-grid">
                  <label class="field field-wide">
                    <span>广告分片关键字</span>
                    <textarea id="adKeywords" rows="3" placeholder="/ad\d+\.ts$&#10;BUMPER"></textarea>
                  </label>

                  <label class="field">
                    <span>定时开始</span>
                    <input id="taskStartAt" type="text" placeholder="yyyyMMddHHmmss" />
                  </label>

                  <label class="field">
                    <span>直播录制时长</span>
                    <input id="liveRecordLimit" type="text" placeholder="00:05:00" />
                  </label>

                  <label class="field">
                    <span>直播刷新间隔（秒）</span>
                    <input id="liveWaitTime" type="number" min="1" step="1" />
                  </label>

                  <label class="field">
                    <span>直播首取分片数</span>
                    <input id="liveTakeCount" type="number" min="1" step="1" />
                  </label>

                  <div class="switches field-wide">
                    <label><input id="livePerformAsVOD" type="checkbox" /> 直播当点播</label>
                    <label><input id="liveRealTimeMerge" type="checkbox" /> 直播实时合并</label>
                    <label><input id="discardLiveSegments" type="checkbox" /> 直播丢弃分片</label>
                    <label><input id="livePipeMux" type="checkbox" /> 直播 PipeMux</label>
                    <label><input id="liveFixVTTByAudio" type="checkbox" /> 直播字幕对齐</label>
                    <label><input id="appendURLParams" type="checkbox" /> 追加 URL 参数</label>
                  </div>
                </div>
              </details>

              <details class="form-section field-wide">
                <summary>混流与任务控制</summary>
                <div class="section-grid">
                  <label class="field field-wide">
                    <span>最终混流参数</span>
                    <input id="muxAfterDone" type="text" placeholder="format=mp4:muxer=ffmpeg" />
                  </label>

                  <label class="field field-wide">
                    <span>导入外部轨道</span>
                    <div class="mux-import-builder">
                      <div class="inline-input">
                        <input id="muxImportPath" type="text" placeholder="/path/to/subtitle.srt" />
                        <button id="choose-mux-import-file" type="button">选择</button>
                      </div>
                      <input id="muxImportLang" type="text" placeholder="lang=eng" />
                      <input id="muxImportName" type="text" placeholder="name=English" />
                      <button id="add-mux-import" type="button">添加</button>
                    </div>
                    <textarea id="muxImports" rows="3" placeholder="path=zh-Hans.srt:lang=chi:name=Chinese"></textarea>
                  </label>

                  <div class="switches field-wide">
                    <label><input id="muxMP4" type="checkbox" /> 混流 MP4</label>
                    <label><input id="noDateInfo" type="checkbox" /> 不写日期 metadata</label>
                    <label><input id="binaryMerge" type="checkbox" /> 二进制直拼</label>
                    <label><input id="skipDownload" type="checkbox" /> 只解析资源</label>
                    <label><input id="skipMerge" type="checkbox" /> 跳过合并</label>
                    <label><input id="checkSegmentsCount" type="checkbox" /> 校验分片数</label>
                    <label><input id="writeMetaJSON" type="checkbox" /> 写 meta JSON</label>
                    <label><input id="keepSegments" type="checkbox" /> 保留临时文件</label>
                    <label><input id="noLog" type="checkbox" /> 关闭日志文件</label>
                  </div>
                </div>
              </details>

              <section id="preflight-result" class="preflight-card field-wide empty">尚未预检查。</section>
            </form>
          </section>
        </section>

        <section id="view-settings" class="view">
          <section class="panel settings-panel">
            <div class="panel-title">
              <span>下载参数</span>
              <button id="save-settings" type="button">保存设置</button>
            </div>

            <div class="settings-grid">
              <section class="core-card field-wide">
                <div class="core-card-head">
                  <span>下载核心</span>
                  <button id="refresh-core" type="button">刷新</button>
                </div>
                <div class="core-grid">
                  <div>
                    <span>状态</span>
                    <strong id="core-status">检查中</strong>
                  </div>
                  <div>
                    <span>版本</span>
                    <strong id="core-version">-</strong>
                  </div>
                  <div class="core-path">
                    <span>路径</span>
                    <strong id="core-path">-</strong>
                  </div>
                </div>
                <div id="core-capabilities" class="capability-list">正在读取核心能力...</div>
              </section>

              <label class="field field-wide">
                <span>FFmpeg 路径</span>
                <div class="inline-input tool-input">
                  <input id="ffmpegPath" type="text" placeholder="/opt/homebrew/bin/ffmpeg" />
                  <button id="choose-ffmpeg" type="button">选择</button>
                  <button id="check-ffmpeg" type="button">检测</button>
                </div>
                <strong id="ffmpeg-check" class="tool-result">尚未检测</strong>
              </label>

              <section class="tools-card field-wide">
                <div class="tools-card-head">
                  <span>外部工具</span>
                  <button id="check-tools" type="button">检测全部</button>
                </div>
                <div id="tool-list" class="tool-list"></div>
              </section>

              <label class="field">
                <span>同时运行任务数</span>
                <input id="maxActiveTasks" type="number" min="1" step="1" />
              </label>
              <label class="field">
                <span>线程数</span>
                <input id="threadCount" type="number" min="1" step="1" />
              </label>
              <label class="field">
                <span>重试次数</span>
                <input id="retryCount" type="number" min="0" step="1" />
              </label>
              <label class="field">
                <span>代理</span>
                <input id="customProxy" type="text" placeholder="http://127.0.0.1:7890" />
              </label>
              <div class="switches field-wide compact">
                <label><input id="useSystemProxy" type="checkbox" /> 使用系统代理</label>
              </div>
            </div>
          </section>
        </section>

        <section id="view-output" class="view">
          <div class="output-grid">
            <section class="panel files-panel">
              <div class="files-head">
                <span>完成文件</span>
                <div>
                  <button id="refresh-files" type="button">刷新文件</button>
                  <button id="open-folder" type="button">打开目录</button>
                </div>
              </div>
              <div id="file-list" class="file-list empty">暂无文件。</div>
            </section>

            <section class="panel log-panel">
              <div class="log-head">
                <span>任务日志</span>
                <div>
                  <button id="export-log" type="button">导出日志</button>
                  <button id="clear-log" type="button">清空日志</button>
                </div>
              </div>
              <pre id="log"></pre>
            </section>
          </div>
        </section>
      </section>
    </main>

    <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>
    <script src="./app.js"></script>
  </body>
</html>
